<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tentatives Capture · Settings</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .muted { color: #6b7280; font-size: 13px; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input[type="text"], input[type="password"] {
        width: 100%; padding: 6px 8px; box-sizing: border-box;
        border: 1px solid #d1d5db; border-radius: 4px;
        font: inherit;
      }
      .row { margin-top: 18px; display: flex; gap: 8px; align-items: center; }
      button { padding: 6px 12px; cursor: pointer; }
      #status { font-size: 13px; }
      .ok { color: #059669; }
      .err { color: #dc2626; }
      code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Tentatives Capture</h1>
    <p class="muted">
      Uploads court tentative-ruling PDFs to a GitHub archive. Needs a personal
      access token (PAT) with <code>repo</code> scope (or, for a public repo, fine-grained
      with <code>contents:write</code>).
    </p>

    <label for="token">GitHub PAT</label>
    <input id="token" type="password" placeholder="ghp_…" autocomplete="off" />

    <label for="owner">Owner</label>
    <input id="owner" type="text" placeholder="aimesy" />

    <label for="repo">Repo</label>
    <input id="repo" type="text" placeholder="tentatives" />

    <label for="branch">Branch (optional)</label>
    <input id="branch" type="text" placeholder="main" />

    <div class="row">
      <button id="save">Save</button>
      <span id="status"></span>
    </div>

    <script src="options.js" type="module"></script>
  </body>
</html>
