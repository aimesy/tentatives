<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tentatives Capture</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 380px; padding: 12px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .muted { color: #6b7280; }
      .small { font-size: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
      button { padding: 6px 10px; cursor: pointer; }
      button[disabled] { cursor: not-allowed; opacity: 0.6; }
      ul { list-style: none; padding: 0; margin: 8px 0 0; max-height: 220px; overflow-y: auto; }
      li { padding: 4px 0; border-top: 1px solid #e5e7eb; font-size: 12px; word-break: break-word; }
      li:first-child { border-top: 0; }
      .status-ok { color: #059669; }
      .status-skip { color: #6b7280; }
      .status-err { color: #dc2626; }
      .status-warn { color: #d97706; }
      a { color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .field { font-size: 12px; padding: 4px 0; border-top: 1px solid #f3f4f6; }
      .field:first-child { border-top: 0; }
      .field b { display: inline-block; min-width: 90px; color: #374151; }
      .pill { display: inline-block; padding: 1px 6px; border-radius: 9999px; font-size: 11px; }
      .pill-ok { background: #d1fae5; color: #065f46; }
      .pill-warn { background: #fef3c7; color: #92400e; }
      .pill-err { background: #fee2e2; color: #991b1b; }
      .progress-bar { width: 100%; height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden; margin: 4px 0; display: none; }
      .progress-bar.on { display: block; }
      .progress-fill { height: 100%; background: #3b82f6; transition: width 200ms; width: 0; }
      .links { display: flex; gap: 12px; }
    </style>
  </head>
  <body>
    <h1>Tentatives Capture</h1>

    <div id="diagnostics">
      <div class="field"><b>Page</b> <span id="d-host" class="muted">checking…</span></div>
      <div class="field"><b>County</b> <span id="d-county" class="muted">—</span></div>
      <div class="field"><b>PDFs found</b> <span id="d-pdfcount" class="muted">—</span></div>
      <div class="field"><b>GitHub config</b> <span id="d-config" class="muted">—</span></div>
    </div>

    <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="row" style="margin-top: 12px;">
      <span id="status" class="small muted"></span>
      <div>
        <button id="rescan" title="Re-scan the current page for PDFs">↻</button>
        <button id="upload" disabled>Upload</button>
      </div>
    </div>
    <ul id="results"></ul>

    <div class="row muted small" style="margin-top: 12px; border-top: 1px solid #e5e7eb; padding-top: 8px;">
      <div class="links">
        <a id="opts" href="#">Settings</a>
        <a id="reload" href="#">Reload page</a>
      </div>
      <a id="archive-link" href="#" target="_blank" rel="noopener" style="display:none">Archive →</a>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
