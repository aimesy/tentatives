<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tentatives Capture</title>
    <link rel="stylesheet" href="../styles/popup.css" />
  </head>
  <body>
    <header class="hdr">
      <div class="hdr-title">Tentatives Capture</div>
      <div class="hdr-conn">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">Checking GitHub config…</span>
      </div>
      <div class="hdr-row">
        <a class="link" id="open-options" href="#">Settings</a>
        <span class="sep">·</span>
        <a class="link" id="reload-page" href="#">Reload page</a>
        <span class="sep">·</span>
        <a class="link" id="open-viewer" href="#" target="_blank" rel="noopener">Open viewer</a>
      </div>
    </header>

    <section class="status-card">
      <dl class="kv">
        <dt>Page</dt>
        <dd id="d-host" class="muted">checking…</dd>
        <dt>County</dt>
        <dd id="d-county"><span class="pill mute">—</span></dd>
        <dt>PDFs found</dt>
        <dd id="d-pdfcount"><span class="pill mute">—</span></dd>
      </dl>
    </section>

    <section class="controls">
      <div class="row split">
        <span class="progress" id="progress-text"></span>
        <div class="row">
          <button class="btn icon" id="rescan" title="Re-scan the current page for PDFs">↻</button>
          <button class="btn primary" id="upload" disabled>Upload</button>
        </div>
      </div>
      <div class="row split">
        <span class="progress" id="bulk-status"></span>
        <div class="row">
          <button class="btn" id="bulk-stop" hidden>Stop</button>
          <button class="btn" id="bulk-scan" disabled title="Open every dept landing page for this county and upload their PDFs">Scan all depts</button>
        </div>
      </div>
      <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="status-line" id="status-line"></div>
    </section>

    <section class="activity">
      <div class="section-head">
        <h2 class="section-title">Recent activity</h2>
        <button class="btn-link" id="clear-activity" hidden>Clear</button>
      </div>
      <ul class="activity-list" id="results" aria-live="polite">
        <li class="empty">No uploads yet on this page.</li>
      </ul>
    </section>

    <footer class="ftr">
      <span class="muted">v<span id="ext-version">0.0.0</span></span>
      <a class="link" id="archive-link" href="#" target="_blank" rel="noopener" hidden>Archive →</a>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
