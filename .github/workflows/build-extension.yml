name: Build extension

# Zips extension/ on every push to master and publishes it as a release asset
# at a stable tag (extension-latest), so README can link to a fixed download URL.

on:
  push:
    branches: [master]
    paths:
      - "extension/**"
      - ".github/workflows/build-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest version
        id: ver
        run: |
          v=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "manifest version: $v"

      - name: Zip extension
        run: |
          cd extension
          zip -r ../tentatives-extension.zip . -x '*.DS_Store'
          cd ..
          ls -la tentatives-extension.zip

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tentatives-extension
          path: tentatives-extension.zip
          if-no-files-found: error

      - name: Publish to extension-latest release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-latest
          name: Browser extension (latest build)
          body: |
            Auto-built from commit `${{ github.sha }}`. Manifest v${{ steps.ver.outputs.version }}.

            **Install**

            1. Download `tentatives-extension.zip` below and unzip somewhere stable
               (the folder has to stay where Chrome can read it).
            2. Chrome: open `chrome://extensions`, toggle **Developer mode** on,
               click **Load unpacked**, and select the unzipped folder.
            3. Click the extension icon, open **Settings**, and paste a GitHub PAT
               with `contents:write` on this repo; set owner = `aimesy`, repo = `tentatives`.
            4. Visit a supported court page and click **Upload**.
          files: tentatives-extension.zip
          overwrite_files: true
          make_latest: true
          prerelease: false
