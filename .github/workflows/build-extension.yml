name: Build extension

# Zips browser-specific extension packages on every push to master and publishes
# them as release assets at a stable tag (extension-latest), so README can link
# to fixed download URLs.

on:
  push:
    branches: [master]
    paths:
      - "extension/**"
      - ".github/workflows/build-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest version
        id: ver
        run: |
          v=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "manifest version: $v"

      - name: Zip extension packages
        run: |
          rm -rf build
          mkdir -p build/chrome build/firefox

          cp -R extension/. build/chrome/
          cp -R extension/. build/firefox/

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/chrome/manifest.json")
          manifest = json.loads(path.read_text())
          permissions = manifest.setdefault("permissions", [])
          if "sidePanel" not in permissions:
              permissions.append("sidePanel")
          manifest.pop("sidebar_action", None)
          manifest["side_panel"] = {
              "default_path": "sidepanel/sidepanel.html",
          }
          manifest["description"] = manifest["description"].replace(
              "Sidebar UI",
              "Side-panel UI",
          )
          manifest["action"]["default_title"] = "Tentatives Capture - open side panel"
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          (cd build/chrome && zip -r ../../tentatives-extension.zip . -x '*.DS_Store')
          cp tentatives-extension.zip tentatives-extension-chrome.zip
          (cd build/firefox && zip -r ../../tentatives-extension-firefox.zip . -x '*.DS_Store')

          ls -la tentatives-extension*.zip

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tentatives-extension
          path: |
            tentatives-extension.zip
            tentatives-extension-chrome.zip
            tentatives-extension-firefox.zip
          if-no-files-found: error

      - name: Publish to extension-latest release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-latest
          name: Browser extension (latest build)
          body: |
            Auto-built from commit `${{ github.sha }}`. Manifest v${{ steps.ver.outputs.version }}.

            **Install**

            1. Chrome: download `tentatives-extension.zip` or
               `tentatives-extension-chrome.zip` below and unzip somewhere stable
               (the folder has to stay where Chrome can read it).
            2. Firefox: download `tentatives-extension-firefox.zip` below to avoid
               Chrome-only `sidePanel` manifest warnings.
            3. Chrome: open `chrome://extensions`, toggle **Developer mode** on,
               click **Load unpacked**, and select the unzipped folder.
            4. Firefox: open `about:debugging#/runtime/this-firefox`, click
               **Load Temporary Add-on**, and select `manifest.json` from the
               unzipped Firefox package.
            5. Click the extension icon, open **Settings**, and paste a GitHub PAT
               with `contents:write` on this repo; set owner = `aimesy`, repo = `tentatives`.
            6. Visit a supported court page and click **Upload**.
          files: |
            tentatives-extension.zip
            tentatives-extension-chrome.zip
            tentatives-extension-firefox.zip
          overwrite_files: true
          make_latest: true
          prerelease: false
