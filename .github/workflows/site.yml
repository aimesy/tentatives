name: Deploy site

# Builds a GitHub Pages payload that contains the static site/ viewer alongside
# the per-county parquet files it queries. Runs on any change to site/, the
# parquet sources under data/, or this workflow itself.

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "data/**/rulings.parquet"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble Pages payload
        run: |
          mkdir -p _site
          cp -R site/* _site/
          touch _site/.nojekyll
          # The viewer fetches data/<county>/rulings.parquet on Pages.
          mkdir -p _site/data
          if [ -d data ]; then
            cp -R data/* _site/data/ || true
          fi
          # Drop any per-county parquet that's not a regular file (defensive).
          find _site/data -type d -empty -delete || true
          echo "Payload:"
          ls -la _site
          echo "Data dirs:"
          ls -la _site/data || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
