name: Parse new PDFs

# Triggers whenever the extension, a fallback capture, or any other path commits
# to archive/. This is the catch-up lane for archive pushes outside the daily
# backfill workflow: OCR textless PDFs, parse new sources, slice ruling PDFs,
# refresh LIVE, and commit the derived data.

on:
  push:
    branches: [main, master]
    paths:
      - "archive/**/*.pdf"
      - "archive/**/captures.ndjson"
      - "archive/**/pages/**/*.html"
      - "archive/**/page-captures.ndjson"
      - "counties/**/*.py"
      - "schema/**/*.py"
      - "ingest/**/*.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: archive-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript ocrmypdf poppler-utils qpdf tesseract-ocr
          pip install -r requirements.txt

      - name: OCR textless PDFs
        run: |
          set -o pipefail
          python -m ingest.ocr_missing_text --county all 2>&1 | tee parse.log

      - name: Parse new captures
        run: |
          set -o pipefail
          python -m ingest.orchestrate 2>&1 | tee -a parse.log

      - name: Slice ruling PDFs
        # Idempotent: only ruling_ids without a slice on disk get sliced.
        # The first run after this workflow is wired up generates ~4k slices
        # (~940MB); subsequent runs only handle new rulings.
        run: |
          set -o pipefail
          python -m ingest.slice_rulings 2>&1 | tee -a parse.log

      - name: Refresh LIVE table
        run: python update-readme.py

      - name: Commit derived data updates
        run: |
          if git diff --quiet -- archive/ data/ site/counties.json README.md LIVE.md && [ -z "$(git status --porcelain archive/ data/ site/counties.json README.md LIVE.md)" ]; then
            echo "no OCR, parquet, slice, or LIVE changes"
            exit 0
          fi
          git config user.name "tentatives-bot"
          git config user.email "tentatives-bot@users.noreply.github.com"
          git add archive/ data/ site/counties.json README.md LIVE.md
          git commit -m "ingest: update parsed data"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: File failure bug report
        if: failure()
        env:
          WORKFLOW_LABEL: "Parse new PDFs"
          LOG_PATH: parse.log
          EXTRA_CONTEXT: |
            Triggered by a push to archive/, counties/, schema/, or ingest/.
            This catch-up lane now runs OCR sidecar generation before parsing,
            then slices rulings and refreshes LIVE. The first failure mode is
            usually a new PDF whose shape the existing parser doesn't handle;
            the source SHA is usually near the traceback.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/file_failure_report.sh
