name: Parse new PDFs

# Triggers whenever the extension (or anything else) commits to archive/.
# Walks the archive, parses any PDFs not yet represented in data/<county>/rulings.parquet,
# and commits the updated parquet files back.

on:
  push:
    branches: [main, master]
    paths:
      - "archive/**/*.pdf"
      - "archive/**/captures.ndjson"
      - "archive/**/pages/**/*.html"
      - "archive/**/page-captures.ndjson"
      - "counties/**/*.py"
      - "schema/**/*.py"
      - "ingest/**/*.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: archive-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse new captures
        run: |
          set -o pipefail
          python -m ingest.orchestrate 2>&1 | tee parse.log

      - name: Slice ruling PDFs
        # Idempotent: only ruling_ids without a slice on disk get sliced.
        # The first run after this workflow is wired up generates ~4k slices
        # (~940MB); subsequent runs only handle new rulings.
        run: |
          set -o pipefail
          python -m ingest.slice_rulings 2>&1 | tee -a parse.log

      - name: Commit updated parquet and slices
        run: |
          if git diff --quiet -- data/ && git diff --quiet -- archive/ && [ -z "$(git status --porcelain archive/)" ]; then
            echo "no parquet or slice changes"
            exit 0
          fi
          git config user.name "tentatives-bot"
          git config user.email "tentatives-bot@users.noreply.github.com"
          git add data/ archive/
          git commit -m "ingest: update rulings.parquet and per-ruling PDFs"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: File failure bug report
        if: failure()
        env:
          WORKFLOW_LABEL: "Parse new PDFs"
          LOG_PATH: parse.log
          EXTRA_CONTEXT: |
            Triggered by a push to archive/, data/, counties/, schema/, or
            ingest/. The first failure mode is usually a new PDF whose
            shape the existing parser doesn't handle — the source SHA is
            in the log near the traceback.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/file_failure_report.sh
