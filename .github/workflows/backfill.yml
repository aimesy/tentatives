name: Backfill captures

on:
  workflow_dispatch:
    inputs:
      county:
        description: County slug, or all
        required: true
        default: all
      mode:
        description: live, wayback, or both
        required: true
        default: wayback
        type: choice
        options:
          - live
          - wayback
          - both
      from_year:
        description: First Wayback capture year
        required: false
      to_year:
        description: Last Wayback capture year
        required: false
      url_from_year:
        description: First source-URL year, for counties with year folders
        required: false
      url_to_year:
        description: Last source-URL year, for counties with year folders
        required: false
      limit:
        description: Optional max refs per county/discovery run
        required: false
  schedule:
    # Daily live harvest at 5 PM America/Los_Angeles. GitHub cron is UTC and
    # cannot express Pacific DST directly, so run both possible UTC slots and
    # gate inside the job by offset, not by the runner's delayed start hour.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    # Re-check Wayback weekly; existing current URLs may acquire new archived
    # versions over time.
    - cron: "17 11 * * 0"

permissions:
  contents: write
  issues: write

concurrency:
  group: archive-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript ocrmypdf poppler-utils qpdf tesseract-ocr
          pip install -r requirements.txt

      - name: Run backfill
        env:
          COUNTY: ${{ github.event.inputs.county || 'all' }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '17 11 * * 0' && 'wayback' || 'live') }}
          FROM_YEAR: ${{ github.event.inputs.from_year }}
          TO_YEAR: ${{ github.event.inputs.to_year }}
          URL_FROM_YEAR: ${{ github.event.inputs.url_from_year }}
          URL_TO_YEAR: ${{ github.event.inputs.url_to_year }}
          LIMIT: ${{ github.event.inputs.limit || (github.event.schedule == '17 11 * * 0' && '50' || '') }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 11 * * 0" ]; then
            pacific_offset="$(TZ=America/Los_Angeles date +%z)"
            case "${{ github.event.schedule }}:$pacific_offset" in
              "0 0 * * *:-0700"|"0 1 * * *:-0800") ;;
              *)
                echo "skipping duplicate DST slot (schedule=${{ github.event.schedule }}, Pacific offset=$pacific_offset)"
                exit 0
                ;;
            esac
          fi
          args=(--county "$COUNTY" --continue-on-error)
          case "$MODE" in
            live) args+=(--live) ;;
            wayback) args+=(--wayback) ;;
            both) args+=(--live --wayback) ;;
            *) echo "invalid mode: $MODE" >&2; exit 2 ;;
          esac
          [ -n "$FROM_YEAR" ] && args+=(--from-year "$FROM_YEAR")
          [ -n "$TO_YEAR" ] && args+=(--to-year "$TO_YEAR")
          [ -n "$URL_FROM_YEAR" ] && args+=(--url-from-year "$URL_FROM_YEAR")
          [ -n "$URL_TO_YEAR" ] && args+=(--url-to-year "$URL_TO_YEAR")
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          python -m ingest.backfill "${args[@]}" | tee backfill.log
          # Assert on refs actually fetched/archived (the "archived/logged N refs"
          # line), not on refs merely discovered. Otherwise a run where discovery
          # works but every download fails would still look green.
          if [ "${{ github.event_name }}" = "schedule" ] && ! grep -Eq '^[-[:alnum:]]+: archived/logged [1-9][0-9]* refs$' backfill.log; then
            echo "scheduled backfill archived zero capture refs" >&2
            exit 1
          fi

      - name: Parse archived sources
        env:
          COUNTY: ${{ github.event.inputs.county || 'all' }}
        run: |
          set -o pipefail
          printf '\n== OCR textless PDFs ==\n' >> backfill.log
          python -m ingest.ocr_missing_text --county "$COUNTY" | tee -a backfill.log
          printf '\n== parse archived sources ==\n' >> backfill.log
          if [ "$COUNTY" = "all" ]; then
            python -m ingest.orchestrate | tee -a backfill.log
          else
            python -m ingest.orchestrate --county "$COUNTY" | tee -a backfill.log
          fi

      - name: Slice parsed PDF rulings
        env:
          COUNTY: ${{ github.event.inputs.county || 'all' }}
        run: |
          set -o pipefail
          printf '\n== slice parsed PDF rulings ==\n' >> backfill.log
          if [ "$COUNTY" = "all" ]; then
            python -m ingest.slice_rulings | tee -a backfill.log
          else
            python -m ingest.slice_rulings --county "$COUNTY" | tee -a backfill.log
          fi

      - name: Refresh LIVE table
        run: python update-readme.py

      - name: Commit archive and data updates
        run: |
          if git diff --quiet -- archive/ data/ README.md LIVE.md; then
            echo "no archive, data, or LIVE changes"
            exit 0
          fi
          git config user.name "tentatives-bot"
          git config user.email "tentatives-bot@users.noreply.github.com"
          git add archive/ data/ README.md LIVE.md
          git commit -m "archive: backfill captures and parsed data"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: File failure bug report
        # File on any failure (schedule or manual). Even when an operator
        # dispatches the workflow themselves, the issue collects the diagnostic
        # snapshot in one place for a follow-up agent to act on.
        if: failure()
        env:
          WORKFLOW_LABEL: "Backfill captures"
          LOG_PATH: backfill.log
          EXTRA_CONTEXT: |
            Scheduled live harvest. Mode was inferred from the cron pattern
            (`0 0 * * *` during Pacific daylight time or `0 1 * * *` during
            Pacific standard time -> live; `17 11 * * 0` -> wayback). The
            maintainer loop captures, OCRs textless PDFs into sidecars, parses,
            slices, refreshes LIVE, and commits derived data. Scheduled runs
            exit non-zero when no county reports any new refs; after that, the
            most common failures are county landing-page drift, OCR tool issues,
            or a parser shape miss on a new source.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/file_failure_report.sh
