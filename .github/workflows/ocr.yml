name: OCR textless PDFs

on:
  workflow_dispatch:
    inputs:
      county:
        description: County slug, or all
        required: true
        default: all
      limit:
        description: Optional max OCR sidecars to create
        required: false
      reparse_existing:
        description: Reparse existing parquet rows after OCR sidecars are created
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  issues: write

concurrency:
  group: ocr-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript ocrmypdf poppler-utils qpdf tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create OCR sidecars
        env:
          COUNTY: ${{ github.event.inputs.county }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -o pipefail
          args=(--county "$COUNTY")
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          python -m ingest.ocr_missing_text "${args[@]}" | tee ocr.log

      - name: Parse archived sources
        env:
          COUNTY: ${{ github.event.inputs.county }}
          REPARSE_EXISTING: ${{ github.event.inputs.reparse_existing }}
        run: |
          set -o pipefail
          args=()
          [ "$COUNTY" != "all" ] && args+=(--county "$COUNTY")
          [ "$REPARSE_EXISTING" = "true" ] && args+=(--reparse-existing)
          python -m ingest.orchestrate "${args[@]}" | tee -a ocr.log

      - name: Slice parsed PDF rulings
        env:
          COUNTY: ${{ github.event.inputs.county }}
        run: |
          set -o pipefail
          if [ "$COUNTY" = "all" ]; then
            python -m ingest.slice_rulings | tee -a ocr.log
          else
            python -m ingest.slice_rulings --county "$COUNTY" | tee -a ocr.log
          fi

      - name: Refresh LIVE table
        run: python update-readme.py

      - name: Commit OCR and parsed data updates
        run: |
          if git diff --quiet -- archive/ data/ README.md LIVE.md; then
            echo "no OCR, archive, data, or LIVE changes"
            exit 0
          fi
          git config user.name "tentatives-bot"
          git config user.email "tentatives-bot@users.noreply.github.com"
          git add archive/ data/ README.md LIVE.md
          git commit -m "ocr: add text layers and parsed data"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: File failure bug report
        if: failure()
        env:
          WORKFLOW_LABEL: "OCR textless PDFs"
          LOG_PATH: ocr.log
          EXTRA_CONTEXT: |
            Manual OCR/reparse lane. It creates non-destructive OCR sidecars
            under archive/<county>/ocr/, reparses requested sources when asked,
            slices rulings, refreshes LIVE, and commits archive/data/README/LIVE.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/file_failure_report.sh
